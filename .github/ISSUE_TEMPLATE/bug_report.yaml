name: Bug report
description: バグや不具合を報告する
title: "fix(<scope>): "

body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます。

        タイトルは可能であれば以下の形式で記載してください。

        `fix(<scope>): <summary>`

        例:
        `fix(codex): report missing session CWD before resume spawn`

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: どのような問題が発生しているか
      placeholder: |
        Codex セッションを開くと誤ったエラーメッセージが表示される
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 問題を再現する手順を記載してください
      placeholder: |
        1. agentsctl を起動する
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待される動作
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: 問題に関係する provider を選択してください
      options:
        - Claude Code
        - Codex
        - Both
        - Provider-independent
        - Other
    validations:
      required: false

  - type: input
    id: agentsctl-version
    attributes:
      label: agentsctl version
      placeholder: "例: v0.3.0"

  - type: input
    id: provider-version
    attributes:
      label: Provider version
      description: Claude Code / Codex などのバージョン
      placeholder: "例: codex 0.156.1"

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "例: macOS 26.0"

  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: "例: iTerm2, Terminal.app, kitty"

  - type: textarea
    id: logs
    attributes:
      label: ログ・エラー
      description: 関連するログやエラーメッセージがあれば貼り付けてください
      render: text

  - type: textarea
    id: additional-context
    attributes:
      label: 補足情報
      description: 関連 Issue、スクリーンショット、発生頻度、調査済み事項など
